<!doctype html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Nhà cung cấp')}">
</head>
<body>
<header th:replace="~{fragments/layout :: nav}">
</header>
<main>
<div th:replace="~{fragments/layout :: messages}">
</div>
<div class="heading">
<h1>Nhà cung cấp</h1>
<a class="button" th:href="@{/suppliers/new}">+ Thêm mới</a>
</div>
<div class="table-wrap">
<table>
<thead>
<tr>
<th>Mã</th>
<th>Tên nhà cung cấp</th>
<th>Số điện thoại</th>
<th>Địa chỉ</th>
<th>Email</th>
<th>Thao tác</th>
</tr>
</thead>
<tbody>
<tr th:each="r : ${rows}">
<td th:text="${r.id}">
</td>
<td th:text="${r.name}">
</td>
<td th:text="${r.phone}">
</td>
<td th:text="${r.address}">
</td>
<td th:text="${r.email}">
</td>
<td>
<a th:href="@{/suppliers/{id}/edit(id=${r.id})}">Chỉnh sửa</a>
</td>
</tr>
<tr th:if="${#lists.isEmpty(rows)}">
<td colspan="8" class="empty">Chưa có dữ liệu.</td>
</tr>
</tbody>
</table>
</div>
</main>
</body>
</html>
