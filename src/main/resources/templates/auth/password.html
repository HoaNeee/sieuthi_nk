<!doctype html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Đổi mật khẩu')}">
</head>
<body>
<header th:replace="~{fragments/layout :: nav}">
</header>
<main>
<div th:replace="~{fragments/layout :: messages}">
</div>
<section class="card narrow">
<h1>Đổi mật khẩu</h1>
<form th:action="@{/password}" method="post" th:object="${form}">
<div class="alert error" th:if="${#fields.hasAnyErrors()}">
<p th:each="e : ${#fields.allErrors()}" th:text="${e}">
</p>
</div>
<label>Mật khẩu hiện tại<input type="password" th:field="*{currentPassword}" autocomplete="current-password" required>
<small class="field-error" th:errors="*{currentPassword}">
</small>
</label>
<label>Mật khẩu mới (ít nhất 10 ký tự, tối đa 72 byte)<input type="password" th:field="*{newPassword}" autocomplete="new-password" required>
<small class="field-error" th:errors="*{newPassword}">
</small>
</label>
<button>Đổi mật khẩu và đăng xuất</button>
</form>
</section>
</main>
</body>
</html>
