<!doctype html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Nhân viên')}">
</head>
<body>
<header th:replace="~{fragments/layout :: nav}">
</header>
<main>
<div th:replace="~{fragments/layout :: messages}">
</div>
<section class="card narrow">
<h1>Nhân viên</h1>
<form th:object="${form}" th:action="${id == null} ? @{/employees} : @{/employees/{id}/edit(id=${id})}" method="post">
<div class="alert error" th:if="${#fields.hasAnyErrors()}">
<p th:each="e : ${#fields.allErrors()}" th:text="${e}">
</p>
</div>
<label>Họ tên<input type="text" th:field="*{name}" required>
<small class="field-error" th:errors="*{name}">
</small>
</label>
<label>Chức vụ<input type="text" th:field="*{title}" >
<small class="field-error" th:errors="*{title}">
</small>
</label>
<label>Tên đăng nhập<input type="text" th:field="*{username}" required>
<small class="field-error" th:errors="*{username}">
</small>
</label>
<label>Mật khẩu mới (để trống để giữ mật khẩu cũ)<input type="password" th:field="*{password}" autocomplete="new-password" maxlength="72">
<small class="field-error" th:errors="*{password}">
</small>
</label>
<label>Vai trò<select th:field="*{role}">
<option value="STAFF">STAFF</option>
<option value="ADMIN">ADMIN</option>
</select>
</label>
<label class="check">
<input type="checkbox" th:field="*{active}">Tài khoản hoạt động</label>
<div class="actions">
<button type="submit">Lưu thông tin</button>
<a class="button secondary" th:href="@{/products}">Về sản phẩm</a>
</div>
</form>
</section>
</main>
</body>
</html>
