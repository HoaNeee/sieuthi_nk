<!doctype html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Hóa đơn')}">
</head>
<body>
<header th:replace="~{fragments/layout :: nav}">
</header>
<main>
<div th:replace="~{fragments/layout :: messages}">
</div>
<div class="heading">
<h1>Lịch sử hóa đơn
</h1>
</div>
<div class="table-wrap">
<table>
<thead>
<tr>
<th>Mã</th>
<th>Thời gian</th>
<th>Nhân viên</th>
<th>Khách hàng</th>
<th>Tổng tiền (VND)</th>
<th>
</th>
</tr>
</thead>
<tbody>
<tr th:each="r : ${rows}">
<td th:text="${r.id}">
</td>
<td th:text="${#temporals.format(r.date,'dd/MM/yyyy HH:mm')}">
</td>
<td th:text="${r.employeeName}">
</td>
<td th:text="${r.customerName ?: 'Khách vãng lai'}">
</td>
<td th:text="${#numbers.formatDecimal(r.total,1,'COMMA',2,'POINT')}">
</td>
<td>
<a th:href="@{/invoices/{id}(id=${r.id})}">Chi tiết</a>
</td>
</tr>
<tr th:if="${#lists.isEmpty(rows)}">
<td colspan="6" class="empty">Chưa có dữ liệu.</td>
</tr>
</tbody>
</table>
</div>
</main>
</body>
</html>
